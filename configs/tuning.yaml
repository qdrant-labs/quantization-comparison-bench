# Development-split sweep used by `qbench select`. Never report these numbers
# as results; they choose the frozen settings evaluated on the test split.
expected_qdrant_version: "1.19.2"
datasets: [fiqa, scifact, nfcorpus, quora]
models: [cohere, bge, bge_base]
builds: 1
seed: 42
hnsw:
  m: 16
  ef_construct: 100
  max_indexing_threads: 8
search:
  ks: [10, 100]
  hnsw_ef: [64, 128, 256, 512]
  rescoring: [false, true]
  oversampling: [1, 2, 4, 8]
  split: dev
  warmup_queries: 50
  repeats: 3
methods:
  - {name: float32, quantizer: none}
  - {name: scalar8, quantizer: scalar, quantile: 0.99}
  - {name: binary1, quantizer: binary, query_encoding: binary}
  - {name: product8, quantizer: product, compression: x8}
  - {name: turbo4, quantizer: turbo, bits: 4}
