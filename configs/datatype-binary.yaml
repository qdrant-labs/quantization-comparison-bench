# Binary retrieval rescored against turbo4 stored vectors, next to the same
# binary retrieval rescored against float32 originals. Oversampling 8 is the
# point binary needed in development selection; 2 matches the primary run.
expected_qdrant_version: "1.19.2"
datasets: [fiqa, scifact, nfcorpus, quora]
models: [cohere, bge]
builds: 3
seed: 42
hnsw:
  m: 16
  ef_construct: 100
  max_indexing_threads: 8
search:
  ks: [10, 100]
  hnsw_ef: [256]
  rescoring: [false, true]
  oversampling: [2, 8]
  split: test
  max_queries: 150
  warmup_queries: 50
  repeats: 5
methods:
  - {name: binary1, quantizer: binary, query_encoding: binary}
  - {name: datatype_turbo4_binary1, datatype: turbo4, quantizer: binary, query_encoding: binary}
  - {name: datatype_turbo4_turbo4, datatype: turbo4, quantizer: turbo, bits: 4}
