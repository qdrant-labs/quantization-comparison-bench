# Cold-start passes: scripts/cache-reset.sh stops the container, drops the
# host page cache, and starts it again before every measured pass. No warm-up
# requests are issued; each pass warms as its queries proceed, so per-query
# `position` matters when reading these records. I/O and page-fault counters
# are snapshotted before and after each pass in passes.jsonl.
expected_qdrant_version: "1.19.2"
datasets: [fiqa, scifact, nfcorpus, quora]
models: [cohere, bge]
builds: 1
seed: 42
cache_state: cold_start
cache_reset_command: scripts/cache-reset.sh
require_telemetry: true
hnsw:
  m: 16
  ef_construct: 100
search:
  ks: [10, 100]
  hnsw_ef: [256]
  rescoring: [true]
  oversampling: [2]
  split: test
  max_queries: 150
  warmup_queries: 1
  repeats: 3
methods:
  - {name: float32, quantizer: none}
  - {name: scalar8, quantizer: scalar, quantile: 0.99}
  - {name: binary1, quantizer: binary, query_encoding: binary}
  - {name: product8, quantizer: product, compression: x8}
  - {name: turbo4, quantizer: turbo, bits: 4}
