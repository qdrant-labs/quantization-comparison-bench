# Quora/bge: rescoring from disk. Each index is built under the normal
# 28 GiB cap, then the container cap is lowered in place to 536870912 bytes
# (below the ~0.8 GB of float32 originals) for the measured passes only, and
# restored afterwards. The runner verifies the effective cgroup limit at each
# step. A method that fails under the cap is recorded and skipped.
expected_qdrant_version: "1.19.2"
datasets: [quora]
models: [bge]
builds: 1
seed: 42
require_telemetry: true
search_memory_limit_bytes: 536870912
search_cap_command: scripts/set-cap.sh
restore_cap_command: scripts/restore-cap.sh
indexing_timeout_seconds: 7200
hnsw:
  m: 16
  ef_construct: 100
  max_indexing_threads: 8
search:
  ks: [10, 100]
  hnsw_ef: [256]
  rescoring: [true]
  oversampling: [2]
  split: test
  max_queries: 150
  warmup_queries: 50
  repeats: 5
methods:
  - {name: float32, quantizer: none}
  - {name: scalar8, quantizer: scalar, quantile: 0.99}
  - {name: binary1, quantizer: binary, query_encoding: binary}
  - {name: product8, quantizer: product, compression: x8}
  - {name: turbo4, quantizer: turbo, bits: 4}
